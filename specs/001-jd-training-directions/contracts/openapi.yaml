openapi: 3.0.3
info:
  title: JobPilot - JD Structured Extraction and Candidate Training Direction Recommendation
  version: "0.1.0"
  description: >
    Corresponds to specs/001-jd-training-directions. This feature has only one endpoint
    in scope: submit JD text and synchronously get back a structured summary + a list of
    candidate training directions, or a rejection response when information is insufficient.

paths:
  /jd-submissions:
    post:
      summary: Submit JD text and get candidate training directions
      operationId: createJdSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JdSubmissionRequest'
      responses:
        '201':
          description: >
            Extraction succeeded and candidate training directions were generated
            (count between 0 and 6; may be fewer than 3 when information is sparse,
            see FR-012).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JdSubmissionAccepted'
        '422':
          description: The JD text is insufficient to identify role/tech-stack; the submission was rejected (FR-011).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JdSubmissionRejected'
        '400':
          description: The request body itself is invalid (e.g., missing the text field, or text is an empty string).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

components:
  schemas:
    JdSubmissionRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: The free-form Job Description original text (FR-001).

    JdSubmissionAccepted:
      type: object
      required: [id, status, extraction, directions, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: For the future question-generation stage to reference the same candidate-direction data (FR-013).
        status:
          type: string
          enum: [accepted]
        extraction:
          $ref: '#/components/schemas/JdExtraction'
        directions:
          type: array
          minItems: 0
          maxItems: 6
          items:
            $ref: '#/components/schemas/CandidateTrainingDirection'
        createdAt:
          type: string
          format: date-time

    JdSubmissionRejected:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [rejected]
        reason:
          type: string
          description: A message prompting the user to provide more complete JD content (FR-011).

    JdExtraction:
      type: object
      required: [role, techStack, seniority, seniorityInferred]
      properties:
        role:
          type: string
        techStack:
          type: array
          items:
            type: string
        seniority:
          type: string
        seniorityInferred:
          type: boolean
          description: true means the JD original text did not explicitly state the seniority level, and the system inferred it (FR-010).

    CandidateTrainingDirection:
      type: object
      required: [id, name, rationale, tags, suggestedQuestionCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        rationale:
          type: string
          description: Must be traceable to specific content in the JD original text (FR-006).
        tags:
          type: array
          minItems: 1
          items:
            type: string
        suggestedQuestionCount:
          type: integer
          minimum: 1

    ValidationError:
      type: object
      required: [message]
      properties:
        message:
          type: string
        issues:
          type: array
          items:
            type: object
